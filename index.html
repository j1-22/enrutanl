<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Citizen Registration Management</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Citizen Registration Management</h1>
        <nav>
            <ul>
                <li><a href="#registration">Registration Forms</a></li>
                <li><a href="#appointments">Appointment Scheduling</a></li>
                <li><a href="#statistics">Real-Time Statistics</a></li>
                <li><a href="#heatmaps">Heat Maps</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="registration">
            <h2>Registration Forms</h2>
            <form>
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
                <button type="submit">Register</button>
            </form>
        </section>

        <section id="appointments">
            <h2>Appointment Scheduling</h2>
            <form>
                <label for="date">Date:</label>
                <input type="date" id="date" name="date" required>
                <label for="time">Time:</label>
                <input type="time" id="time" name="time" required>
                <button type="submit">Schedule</button>
            </form>
        </section>

        <section id="statistics">
            <h2>Real-Time Statistics</h2>
            <div id="stats">
                <!-- Real-time statistics will be displayed here -->
            </div>
        </section>

        <section id="heatmaps">
            <h2>Heat Maps</h2>
            <div id="heatmap">
                <!-- Heat maps will be displayed here -->
            </div>
        </section>

        <section id="bulk-registration">
            <h2>Bulk Registration</h2>
            <form>
                <label for="bulk-file">Upload CSV:</label>
                <input type="file" id="bulk-file" name="bulk-file" accept=".csv">
                <button type="submit">Upload</button>
            </form>
        </section>
    </main>

    <footer>
        <p>Administrative Controls for Clinic and School Staff</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
